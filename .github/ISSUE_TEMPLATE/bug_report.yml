name: "🐞 AeroDeck Ground View report"
description: Report a freeze, crash, graphics, camera, display, or startup problem.
title: "[🐞 Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve AeroDeck Ground View.

        If you are comparing test runs, attach a separate ZIP for each run and include its test number and local time in the filename. You can still submit a report if you cannot collect logs; explain why in the evidence notes.

        Please review files for personal information before attaching them.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: "🔎 Before you submit"
      options:
        - label: I searched for the same or a similar issue.
          required: true
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: What happened?
      options:
        - MSFS froze but recovered
        - MSFS froze and stayed unresponsive
        - MSFS closed or crashed
        - AeroDeck Ground View closed or crashed
        - PFD or camera display problem
        - TAXI button or activation problem
        - Startup or connection problem
        - Performance problem
        - Other problem
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: when-occurred
    attributes:
      label: What were you doing when it happened?
      options:
        - Taking a screenshot or starting a screen capture
        - Opening or using the Steam overlay
        - Pressing TAXI or enabling a camera
        - Changing the MSFS camera view
        - Using ChasePlane or other camera software
        - Loading or reloading a flight
        - Starting AeroDeck Ground View or MSFS
        - Normal operation
        - Other
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: screenshot-method
    attributes:
      label: "🖼️ Which screenshot or capture method did you use?"
      description: Choose “Not applicable” if the issue did not involve a screenshot or recording.
      options:
        - Steam F12
        - Print Screen key
        - Windows Snipping Tool or Win+Shift+S
        - Xbox Game Bar
        - OBS or another recording tool
        - Another method
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: input
    id: incident-time
    attributes:
      label: "🕒 When did it happen? Include your time zone"
      description: An approximate time is useful. Please include the date and local time zone, for example “23 Sep 2026, 21:30 BST”.
      placeholder: Date, local time, and time zone
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "🔁 How often have you reproduced it?"
      options:
        - Every attempt
        - More than once, but not every time
        - Happened once so far
        - I have not tried again
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: "💬 Describe what happened and what you expected"
      description: For a freeze, say whether the picture stopped, audio continued, controls still worked, or you had to close MSFS.
      placeholder: |
        What I saw:
        What I expected:
        Did MSFS recover, or did you have to close it?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🪜 What were you doing immediately before it happened?"
      description: List the steps if you can. If it happened once, describe the flight and the action just before the problem.
      placeholder: |
        1. Start MSFS and load the aircraft...
        2. Start AeroDeck Ground View...
        3. Take a screenshot or do the action...
        4. Describe what happened...
    validations:
      required: true

  - type: checkboxes
    id: affected-views
    attributes:
      label: What was affected? Select all that apply
      options:
        - label: MSFS simulator
        - label: AeroDeck Ground View
        - label: Nose camera
        - label: Tail camera
        - label: Left PFD
        - label: Right PFD
        - label: Both PFDs
        - label: External or ChasePlane camera

  - type: input
    id: aerodeck-version
    attributes:
      label: AeroDeck Ground View version
      description: If it did not start, enter “Could not start”.
      placeholder: Version shown in AeroDeck Ground View
    validations:
      required: true

  - type: input
    id: msfs-version
    attributes:
      label: MSFS 2024 version
      description: Enter “Not sure” if you do not know it.
      placeholder: For example, 1.8.16.0
    validations:
      required: true

  - type: dropdown
    id: aircraft
    attributes:
      label: Aircraft
      options:
        - iniBuilds A350-1000
        - iniBuilds A350-900
        - iniBuilds A350-900 ULR
        - Another aircraft
        - Not applicable - the flight did not load
        - Not sure
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version, if known
      placeholder: For example, Windows 11 25H2

  - type: input
    id: gpu-driver
    attributes:
      label: Graphics card and driver version, if known
      placeholder: For example, RTX 4090 and driver 581.xx

  - type: dropdown
    id: graphics-api
    attributes:
      label: MSFS graphics mode, if known
      options:
        - DirectX 12
        - DirectX 11
        - Not sure

  - type: dropdown
    id: other-software
    attributes:
      label: Other camera, graphics, or overlay software in use
      description: Select all that apply. Leave this blank if none were in use.
      multiple: true
      options:
        - Steam overlay
        - Xbox Game Bar
        - ChasePlane
        - ReShade
        - OBS or another capture tool
        - NVIDIA or AMD overlay
        - Other camera or graphics software

  - type: textarea
    id: recent-changes
    attributes:
      label: Recent updates or changes, if any
      description: Mention updates to MSFS, AeroDeck Ground View, Windows, graphics drivers, or other camera and overlay tools.
      placeholder: Leave blank if nothing changed or you are not sure.

  - type: markdown
    attributes:
      value: |
        ## 📎 Logs and other evidence

        In AeroDeck Ground View, open **Diagnostics → Open log folder**. For controlled comparisons, attach each test run as its own ZIP and name it with the test number and time, such as `test-01-2026-09-23-2130.zip` and `test-02-2026-09-23-2140.zip`.

        Include the available files from the same test session:

        - `diagnostics-summary.txt`
        - `advanced-diagnostics.log`
        - `advanced-diagnostics.jsonl`
        - `advanced-state.txt`
        - Windows Event Viewer export for the same time, if available. Put `.evtx` files inside a ZIP before uploading.

        You can still report a startup failure or missing logs. Explain what you could not collect in the evidence notes below.

  - type: upload
    id: evidence-files
    attributes:
      label: "📁 Attach log ZIPs, logs, screenshots, or video"
      description: Attach separate ZIPs for separate test attempts when possible. ZIP Windows `.evtx` files before attaching them.
    validations:
      required: false

  - type: textarea
    id: evidence-notes
    attributes:
      label: "📝 Evidence notes"
      description: If you could not attach logs, say which files were missing and why. You can also identify what each ZIP contains.
      placeholder: |
        Test 1 ZIP:
        Test 2 ZIP:
        Missing files and reason:

  - type: textarea
    id: additional-information
    attributes:
      label: Anything else that may help
      placeholder: Other details you think might matter.
